<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5C050"/>
      <stop offset="100%" stop-color="#C68410"/>
    </linearGradient>
    <linearGradient id="cryoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7FD4FF"/>
      <stop offset="100%" stop-color="#0A7EB8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#C68410" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Subtle grid accent -->
  <line x1="20" y1="2" x2="20" y2="62" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>
  <line x1="44" y1="2" x2="44" y2="62" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>
  <line x1="2" y1="20" x2="62" y2="20" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>
  <line x1="2" y1="44" x2="62" y2="44" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>

  <!-- Conical Vessel / Vortex Geometry (AFD Conical Profile) -->
  <path d="M 16 18 L 48 18 L 36 46 L 28 46 Z" fill="none" stroke="url(#cryoGrad)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Agitator Screw Spiral Axis -->
  <path d="M 32 18 L 32 46" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Sublimation Phase Crystal Core -->
  <circle cx="32" cy="30" r="5" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="32" cy="30" r="2" fill="#FFFFFF"/>

  <!-- Discharge valve nozzle -->
  <rect x="29" y="46" width="6" height="4" rx="1" fill="url(#goldGrad)"/>
</svg>
